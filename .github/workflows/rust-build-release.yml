name: rust-build-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x86_64 (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        run: cargo build --release --manifest-path ms-rs/Cargo.toml
      - name: Smoke test
        shell: bash
        run: |
          ls -lh ms-rs/target/release/msapp.exe ms-rs/target/release/mserver.exe ms-rs/target/release/msparity.exe ms-rs/target/release/msadmin.exe
          ./ms-rs/target/release/mserver.exe --help >/dev/null
          ./ms-rs/target/release/msparity.exe --help >/dev/null
          ./ms-rs/target/release/msadmin.exe --selfcheck >/dev/null
      - name: Assemble assets
        shell: bash
        run: |
          mkdir -p dist
          cp ms-rs/target/release/msapp.exe    dist/msapp-windows-x86_64.exe
          cp ms-rs/target/release/mserver.exe  dist/mserver-windows-x86_64.exe
          cp ms-rs/target/release/msparity.exe dist/msparity-windows-x86_64.exe
          cp ms-rs/target/release/msadmin.exe  dist/msadmin-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/
          if-no-files-found: error

  linux:
    name: Linux x86_64 (ELF)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install eframe system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-randr0-dev libxkbcommon-dev libxkbcommon-x11-dev libgtk-3-dev libssl-dev
      - name: Build (release)
        run: cargo build --release --manifest-path ms-rs/Cargo.toml
      - name: Smoke test
        run: |
          file ms-rs/target/release/msapp ms-rs/target/release/mserver ms-rs/target/release/msparity ms-rs/target/release/msadmin
          ./ms-rs/target/release/mserver --help >/dev/null
          ./ms-rs/target/release/msparity --help >/dev/null
          ./ms-rs/target/release/msadmin --selfcheck >/dev/null
      - name: Assemble assets
        run: |
          mkdir -p dist
          cp ms-rs/target/release/msapp    dist/msapp-linux-x86_64
          cp ms-rs/target/release/mserver  dist/mserver-linux-x86_64
          cp ms-rs/target/release/msparity dist/msparity-linux-x86_64
          cp ms-rs/target/release/msadmin  dist/msadmin-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS aarch64 (Mach-O)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        run: cargo build --release --manifest-path ms-rs/Cargo.toml
      - name: Smoke test
        run: |
          file ms-rs/target/release/msapp ms-rs/target/release/mserver ms-rs/target/release/msparity ms-rs/target/release/msadmin
          ./ms-rs/target/release/mserver --help >/dev/null
          ./ms-rs/target/release/msparity --help >/dev/null
          ./ms-rs/target/release/msadmin --selfcheck >/dev/null
      - name: Assemble assets
        run: |
          mkdir -p dist
          cp ms-rs/target/release/msapp    dist/msapp-macos-aarch64
          cp ms-rs/target/release/mserver  dist/mserver-macos-aarch64
          cp ms-rs/target/release/msparity dist/msparity-macos-aarch64
          cp ms-rs/target/release/msadmin  dist/msadmin-macos-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * | tee SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Auto build ${{ github.sha }}
          body: |
            Auto-built from commit `${{ github.sha }}`.

            Commit message: ${{ github.event.head_commit.message }}

            Binaries:
            - **msapp** — Minesweeper GUI client (egui/eframe) with `--listen` scripting server and telemetry link
            - **mserver** — simulation/telemetry server (1:1 port of `server.js`)
            - **msparity** — differential byte-parity harness
            - **msadmin** — diagnostics admin web server (1:1 port of `ms/admin/*`, drop-in compatible with the existing Node admin config/db/key)

            Format per platform:
            - Windows: `.exe` (PE)
            - Linux: ELF executable (no extension)
            - macOS: Mach-O executable (no extension)

            Checksums in `SHA256SUMS.txt`.
          files: dist/*
          fail_on_unmatched_files: true
